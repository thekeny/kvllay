name: CI

on:
  push:
    branches: [ main, 1.0.0 ]
  pull_request:
    branches: [ main, 1.0.0 ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install redis

      - name: Compile kvllay
        run: |
          mkdir -p build
          g++ src/main.cpp -std=c++17 -Wall -Wextra -O2 -I header -I include -I include/kvllay -o build/kvllay -pthread

      - name: Run test suite
        run: |
          ./build/kvllay -p 6389 &
          SERVER_PID=$!
          sleep 1
          python3 tests/run_all.py 6389
          kill $SERVER_PID

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install redis

      - name: Compile kvllay (MinGW)
        shell: pwsh
        run: |
          if (!(Test-Path -Path "build")) { New-Item -ItemType Directory -Path "build" }
          g++ src/main.cpp -std=c++17 -Wall -Wextra -O2 -static -static-libgcc -static-libstdc++ -s -D _WIN32_WINNT=0x0A00 -I header -I include -I include/kvllay -o build/kvllay.exe -lws2_32

      - name: Run test suite
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\kvllay.exe" -ArgumentList "-p 6389" -PassThru
          Start-Sleep -Seconds 1
          try {
            python tests/run_all.py 6389
          } finally {
            Stop-Process -Id $process.Id -Force
          }

  test-website:
    name: Test Website Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  sync-dockerhub-desc:
    name: Sync Docker Hub Description
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Docker Hub Description & Overview
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kenyka/kvllay
          short-description: "Lightweight in-memory key-value database written in C++17 compatible with Redis RESP2"
          readme-filepath: ./README.md
          enable-url-completion: true
